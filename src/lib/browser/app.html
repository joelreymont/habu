<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--title--></title>
<style>#text.error { color: #b00020; white-space: pre-wrap; overflow-wrap: anywhere; }</style>
</head>
<body>
<div id="text">loading</div>
<script type="text/plain" id="page-id"><!--page-id--></script>
<script type="application/base64" id="app.js"><!--app.js--></script>
<script type="module">
// app.js becomes a blob: module and starts with the page id; it takes the
// view's other scripts and the module from the server.
const text = (id) => document.getElementById(id).textContent;
try {
  const url = URL.createObjectURL(new Blob([Uint8Array.fromBase64(text("app.js"))], { type: "text/javascript" }));
  let app;
  try { app = await import(url); } finally { URL.revokeObjectURL(url); }
  await app.start(text("page-id"));
} catch (e) {
  const shown = document.querySelector("#text");
  shown.textContent = String(e);
  shown.className = "error";
  console.error(e);
}
</script>
</body>
</html>
