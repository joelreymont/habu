name: ANSI Conformance

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

env:
  ANSI_TEST_REV: a1107c9564833680c72946f1cd87c9c3bbe0de5a
  ANSI_TEST_DIR: /tmp/habu-ansi/ansi-test

jobs:
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.1

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl

      - name: Fetch pinned ansi-test corpus
        run: |
          mkdir -p /tmp/habu-ansi
          if [ ! -d "$ANSI_TEST_DIR/.git" ]; then
            git clone https://gitlab.common-lisp.net/ansi-test/ansi-test.git "$ANSI_TEST_DIR"
          fi
          git -C "$ANSI_TEST_DIR" fetch --depth=1 origin "$ANSI_TEST_REV"
          git -C "$ANSI_TEST_DIR" checkout --detach "$ANSI_TEST_REV"

      - name: Run smoke corpus on SBCL and Habu
        run: |
          tools/ansi/run.sh sbcl --ansi-dir "$ANSI_TEST_DIR" --input "$GITHUB_WORKSPACE/tools/ansi/smoke.lsp" --tag ci-smoke
          tools/ansi/run.sh habu --ansi-dir "$ANSI_TEST_DIR" --input "$GITHUB_WORKSPACE/tools/ansi/smoke.lsp" --tag ci-smoke

      - name: Normalize smoke logs
        run: |
          tools/ansi/parse_results.py docs/ansi/raw/sbcl-ci-smoke.log
          tools/ansi/parse_results.py docs/ansi/raw/habu-ci-smoke.log

      - name: Check smoke regressions against baseline
        run: |
          python3 tools/ansi/check_regression.py --baseline docs/ansi-parity-baseline.json --current docs/ansi/results/sbcl-ci-smoke.json --runtime sbcl
          python3 tools/ansi/check_regression.py --baseline docs/ansi-parity-baseline.json --current docs/ansi/results/habu-ci-smoke.json --runtime habu

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansi-smoke-${{ github.run_id }}
          path: |
            docs/ansi/raw/sbcl-ci-smoke.log
            docs/ansi/raw/habu-ci-smoke.log
            docs/ansi/results/sbcl-ci-smoke.json
            docs/ansi/results/habu-ci-smoke.json
          if-no-files-found: warn

  full-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.1

      - name: Install SBCL
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl

      - name: Fetch pinned ansi-test corpus
        run: |
          mkdir -p /tmp/habu-ansi
          if [ ! -d "$ANSI_TEST_DIR/.git" ]; then
            git clone https://gitlab.common-lisp.net/ansi-test/ansi-test.git "$ANSI_TEST_DIR"
          fi
          git -C "$ANSI_TEST_DIR" fetch --depth=1 origin "$ANSI_TEST_REV"
          git -C "$ANSI_TEST_DIR" checkout --detach "$ANSI_TEST_REV"

      - name: Run full corpus on SBCL and Habu
        run: |
          tools/ansi/run.sh sbcl --ansi-dir "$ANSI_TEST_DIR" --tag ci-full
          tools/ansi/run.sh habu --ansi-dir "$ANSI_TEST_DIR" --tag ci-full

      - name: Normalize full logs
        run: |
          tools/ansi/parse_results.py docs/ansi/raw/sbcl-ci-full.log
          tools/ansi/parse_results.py docs/ansi/raw/habu-ci-full.log

      - name: Check full regressions against baseline
        run: |
          python3 tools/ansi/check_regression.py --baseline docs/ansi-parity-baseline.json --current docs/ansi/results/sbcl-ci-full.json --runtime sbcl
          python3 tools/ansi/check_regression.py --baseline docs/ansi-parity-baseline.json --current docs/ansi/results/habu-ci-full.json --runtime habu

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansi-full-${{ github.run_id }}
          path: |
            docs/ansi/raw/sbcl-ci-full.log
            docs/ansi/raw/habu-ci-full.log
            docs/ansi/results/sbcl-ci-full.json
            docs/ansi/results/habu-ci-full.json
          if-no-files-found: warn
