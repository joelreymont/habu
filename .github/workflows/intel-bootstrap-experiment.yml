name: Intel host bootstrap experiment
# checkpoint 2026-09-19T13:40Z

on:
  push:
    branches: [experiment/intel-bootstrap-20260919, experiment/x86-native-20260919]
    paths:
      - .github/workflows/intel-bootstrap-experiment.yml
      - .github/patches/intel-hosted-recovery.patch
      - .github/fixtures/intel/**
      - src/targets/x86-64/**
      - src/compiler/target.f
      - src/compiler/ir/**
      - src/core/checker.f
      - test/compiler/x86-64-*.f

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      HABU_TARGET: linux-aarch64
      HB_TMP: /tmp/habu-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record source and apply exact recovery patch
        shell: bash
        run: |
          mkdir -p "$HB_TMP" "$RUNNER_TEMP/habu-intel-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/habu-intel-evidence/source-commit.txt"
          uname -a > "$RUNNER_TEMP/habu-intel-evidence/host.txt"
          printf '%s  %s\n' c206cb99642fbcf24f0c363158d18d237037f6e66dc56d1276083227c463861f .github/patches/intel-hosted-recovery.patch | sha256sum --check
          git apply --check .github/patches/intel-hosted-recovery.patch
          git apply .github/patches/intel-hosted-recovery.patch
          git diff --binary > "$RUNNER_TEMP/habu-intel-evidence/applied.patch"
          cp .github/patches/intel-hosted-recovery.patch "$RUNNER_TEMP/habu-intel-evidence/"
          tar --exclude=.git -czf "$RUNNER_TEMP/habu-intel-evidence/habu-patched-source.tar.gz" .
      - name: Provision isolated bootstrap dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gforth autoconf automake libtool-bin libffi-dev libltdl-dev texinfo qemu-user-static libc6-arm64-cross
          dpkg-query -W gforth qemu-user-static libc6-arm64-cross > "$RUNNER_TEMP/habu-intel-evidence/packages.txt"
      - name: Build pinned Gforth recovery host
        shell: bash
        run: |
          git clone --depth 1 --branch 0.7.9_20260610 https://github.com/forthy42/gforth.git "$RUNNER_TEMP/gforth"
          cd "$RUNNER_TEMP/gforth"
          test "$(git rev-parse 0.7.9_20260610)" = 39c54928ae2b62c31ed828a99fc6507a70a47cbe
          git rev-parse HEAD > "$RUNNER_TEMP/habu-intel-evidence/gforth-commit.txt"
          ./autogen.sh
          UNSUITABLE_CC=none ./configure --prefix="$RUNNER_TEMP/gforth-installed"
          make -j2 gforth-itc gforth-light.fi
          ./gforth-itc -i ./gforth-light.fi -e ': f {: a :} a . cr ; 1 f bye'
      - name: Emit genuine ARM64 recovery REPL on Intel
        shell: bash
        run: |
          export GFORTHPATH=".:$RUNNER_TEMP/gforth:$RUNNER_TEMP/gforth/arch/amd64:$RUNNER_TEMP/gforth/kernel"
          export HABU_OUTPUT="$HB_TMP/hb-aarch64-recovery"
          "$RUNNER_TEMP/gforth/gforth-itc" -i "$RUNNER_TEMP/gforth/gforth-light.fi" -e 'require bootstrap/cg/forth.fs s" HABU_OUTPUT" getenv FORTH-REPL-EXE bye' > "$RUNNER_TEMP/habu-intel-evidence/build.stdout" 2> "$RUNNER_TEMP/habu-intel-evidence/build.stderr"
          file "$HABU_OUTPUT" | tee "$RUNNER_TEMP/habu-intel-evidence/engine-format.txt"
          cp "$HABU_OUTPUT" "$RUNNER_TEMP/habu-intel-evidence/"
          sha256sum "$HABU_OUTPUT" > "$RUNNER_TEMP/habu-intel-evidence/engine.sha256"
      - name: Execute real compiler runtime and rejection gates
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/habu-intel-evidence"
          run_case() {
            local name="$1" want="$2" marker="$3"
            local rc=0
            timeout --kill-after=5s 180s qemu-aarch64-static -L /usr/aarch64-linux-gnu "$HB_TMP/hb-aarch64-recovery" --load ".github/fixtures/intel/$name.f" </dev/null >"$evidence/$name.stdout" 2>"$evidence/$name.stderr" || rc=$?
            printf '%s\n' "$rc" > "$evidence/$name.exit"
            cat "$evidence/$name.stdout"
            cat "$evidence/$name.stderr" >&2
            test "$rc" -eq "$want"
            grep -Fq "$marker" "$evidence/$name.stdout"
          }
          run_case smoke 0 'real-checker-and-runtime: ok'
          run_case adt 0 'real-adt-runtime: ok'
          run_case reject 70 'NEGATIVE-ARMED'
          ! grep -Fq 'NEGATIVE-LEAKED' "$evidence/reject.stdout"
          grep -Fq 'wrong-effect' "$evidence/reject.stderr"
          run_case guard 83 'GUARD-ARMED'
          ! grep -Fq 'GUARD-LEAKED' "$evidence/guard.stdout"
          timeout --kill-after=5s 180s qemu-aarch64-static -L /usr/aarch64-linux-gnu "$HB_TMP/hb-aarch64-recovery" --load test/compiler/x86-64-asm.f </dev/null >"$evidence/x86-asm.stdout" 2>"$evidence/x86-asm.stderr"
          grep -Fq 'test: ok' "$evidence/x86-asm.stdout"
          timeout --kill-after=5s 180s qemu-aarch64-static -L /usr/aarch64-linux-gnu "$HB_TMP/hb-aarch64-recovery" --load test/compiler/x86-64-target.f </dev/null >"$evidence/x86-target.stdout" 2>"$evidence/x86-target.stderr"
          grep -Fq 'test: ok' "$evidence/x86-target.stdout"
          printf ': STDIN-CHECK ( n -- n ) 1 + ;\n41 STDIN-CHECK . cr\n' > "$HB_TMP/stdin.f"
          timeout --kill-after=5s 180s qemu-aarch64-static -L /usr/aarch64-linux-gnu "$HB_TMP/hb-aarch64-recovery" < "$HB_TMP/stdin.f" > "$evidence/stdin.stdout" 2> "$evidence/stdin.stderr"
          grep -Eq '(^|[[:space:]])42([[:space:]]|$)' "$evidence/stdin.stdout"
          printf '0\n' > "$evidence/stdin.exit"
          printf 'Real ARM64 recovery engine passed smoke, ADT, rejection, protected-write, and stdin gates on x86-64 under QEMU. Native x86 backend and production selfbuild are NOT established.\n' > "$evidence/RESULT.txt"
      - name: Preserve evidence even when bootstrap fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: habu-intel-bootstrap-evidence
          path: ${{ runner.temp }}/habu-intel-evidence/
          if-no-files-found: error
          retention-days: 7
