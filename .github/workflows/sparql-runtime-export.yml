name: Export SPARQL verification inputs
on:
  push:
    branches: [sparql-runtime-export-20261117]
    paths: [.github/workflows/sparql-runtime-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch current Habu sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/repositories export/packages
          path="$PWD/export/repositories/habu"
          git init -q "$path"
          git -C "$path" remote add origin https://github.com/joelreymont/habu.git
          git -C "$path" fetch --no-tags --depth=1 origin master
          git -C "$path" checkout -q -b master FETCH_HEAD
          git -C "$path" fetch --no-tags --depth=4 origin sparql:refs/heads/sparql x86:refs/heads/x86
          git -C "$path" show-ref --heads
          tar -czf export/sources.tar.gz -C export repositories
          sha256sum export/sources.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sparql-current-sources
          path: export/sources.tar.gz
          retention-days: 3
      - name: Download PostgreSQL 18 and pgvector packages
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/export/packages:/packages" postgres:18-trixie sh -ec '
            rm -f /etc/apt/apt.conf.d/docker-clean
            apt-get update
            apt-get -y --download-only --reinstall install postgresql-18 postgresql-client-18 postgresql-18-pgvector libpq5 liburing2
            cp /var/cache/apt/archives/*.deb /packages/
          '
          cd export/packages
          sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: postgresql18-offline-packages
          path: export/packages/
          compression-level: 0
          retention-days: 3
