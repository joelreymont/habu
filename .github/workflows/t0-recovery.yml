name: Recover the T0 compiler

on:
  push:
    branches: [x86-bootstrap-validation]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download the verified native checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14165794873'
          run-id: '43725207061'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/habu-t0-recovery/seed
      - name: Verify the checkpoint
        run: |
          test "$(uname -m)" = aarch64
          cd "$RUNNER_TEMP/habu-t0-recovery/seed/latest"
          sha256sum -c "$GITHUB_WORKSPACE/ci/recovery/checkpoint.sha256"
          printf '%s\n' '6e94c677415f7f5113f0d3045adf3605cc86dd9f' 'c91b90edc61bde0bbf5fc34946ebe55b0e6e2b49' | cmp - source.txt
          chmod +x hb
          printf 'RECOVERY_ROOT=%s/habu-t0-recovery\n' "$RUNNER_TEMP" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/habu-t0-recovery/latest"
          cp hb hb.map source.txt sha256.txt "$RUNNER_TEMP/habu-t0-recovery/latest/"
      - name: Provision addr-child
        run: |
          mkdir -p "$RECOVERY_ROOT/addr-child/tmp" "$RECOVERY_ROOT/addr-child/objects" "$RECOVERY_ROOT/results/addr-child"
          git fetch --depth=1 origin 63f4ba72015bffeedb40f8ae11ef7c47c0febf96
          git worktree add --detach "$RECOVERY_ROOT/addr-child/source" 63f4ba72015bffeedb40f8ae11ef7c47c0febf96
          test "$(git -C "$RECOVERY_ROOT/addr-child/source" write-tree)" = 0f30c284ff1406b6b6ab8e266f7fa3a92d7bac29
          printf '%s\n' '63f4ba72015bffeedb40f8ae11ef7c47c0febf96' '0f30c284ff1406b6b6ab8e266f7fa3a92d7bac29' >"$RECOVERY_ROOT/results/addr-child/source.txt"
      - name: Engine addr-child
        working-directory: ${{ runner.temp }}/habu-t0-recovery/addr-child/source
        env:
          TMPDIR: ${{ runner.temp }}/habu-t0-recovery/addr-child/tmp
          HABU_OUT: ${{ runner.temp }}/habu-t0-recovery/addr-child/objects
        run: >-
          timeout 300 "$RECOVERY_ROOT/seed/latest/hb" --load "$GITHUB_WORKSPACE/ci/recovery/t0-first.f" tools/hb-build.f -- --engine -o "$RECOVERY_ROOT/results/addr-child/hb"
          </dev/null 2>&1 | tee "$RECOVERY_ROOT/results/addr-child/engine.log"
      - name: Smoke addr-child
        working-directory: ${{ runner.temp }}/habu-t0-recovery/addr-child/source
        env:
          TMPDIR: ${{ runner.temp }}/habu-t0-recovery/addr-child/tmp
          HABU_OUT: ${{ runner.temp }}/habu-t0-recovery/addr-child/objects
        run: >-
          timeout 300 "$RECOVERY_ROOT/results/addr-child/hb" --load "$GITHUB_WORKSPACE/ci/recovery/t0-first.f" "$GITHUB_WORKSPACE/ci/recovery/smoke.f"
          </dev/null 2>&1 | tee "$RECOVERY_ROOT/results/addr-child/smoke.log"
      - name: Record addr-child
        working-directory: ${{ runner.temp }}/habu-t0-recovery/results/addr-child
        run: |
          sha256sum hb hb.map >sha256.txt
          cp hb hb.map source.txt sha256.txt "$RECOVERY_ROOT/latest/"
      - name: Provision child-run
        run: |
          mkdir -p "$RECOVERY_ROOT/child-run/tmp" "$RECOVERY_ROOT/child-run/objects" "$RECOVERY_ROOT/results/child-run"
          git fetch --depth=1 origin 1db253be07c6006fc930653294c5e1438e78615f
          git worktree add --detach "$RECOVERY_ROOT/child-run/source" 1db253be07c6006fc930653294c5e1438e78615f
          test "$(git -C "$RECOVERY_ROOT/child-run/source" write-tree)" = 121030791340e117416ce6c3ea6c66114bc64d3c
          printf '%s\n' '1db253be07c6006fc930653294c5e1438e78615f' '121030791340e117416ce6c3ea6c66114bc64d3c' >"$RECOVERY_ROOT/results/child-run/source.txt"
      - name: Engine child-run
        working-directory: ${{ runner.temp }}/habu-t0-recovery/child-run/source
        env:
