name: Recover the T0 compiler

on:
  push:
    branches: [x86-bootstrap-validation]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download the verified native checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14166169591'
          run-id: '43726034664'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/habu-t0-recovery/seed
      - name: Verify the checkpoint
        run: |
          test "$(uname -m)" = aarch64
          cd "$RUNNER_TEMP/habu-t0-recovery/seed/latest"
          sha256sum -c "$GITHUB_WORKSPACE/ci/recovery/checkpoint.sha256"
          printf '%s\n' 'a89f92b0b52fd5e2efb9618921afe02dc738f245' 'b304541b0be681645d83d9d3c9694c241cd2b483' | cmp - source.txt
          chmod +x hb
          printf 'RECOVERY_ROOT=%s/habu-t0-recovery\n' "$RUNNER_TEMP" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/habu-t0-recovery/latest"
          cp hb hb.map source.txt sha256.txt "$RUNNER_TEMP/habu-t0-recovery/latest/"
      - name: Provision define-effect
        run: |
          mkdir -p "$RECOVERY_ROOT/define-effect/tmp" "$RECOVERY_ROOT/define-effect/objects" "$RECOVERY_ROOT/results/define-effect"
          git fetch --depth=1 origin a64516dcf46f6dee3efae54675400ca8e9268674
          git worktree add --detach "$RECOVERY_ROOT/define-effect/source" a64516dcf46f6dee3efae54675400ca8e9268674
          test "$(git -C "$RECOVERY_ROOT/define-effect/source" write-tree)" = ab9ac2434709c21454cae18bc1ab5819a7494ce3
          printf '%s\n' 'a64516dcf46f6dee3efae54675400ca8e9268674' 'ab9ac2434709c21454cae18bc1ab5819a7494ce3' >"$RECOVERY_ROOT/results/define-effect/source.txt"
      - name: Engine define-effect
        working-directory: ${{ runner.temp }}/habu-t0-recovery/define-effect/source
        env:
          TMPDIR: ${{ runner.temp }}/habu-t0-recovery/define-effect/tmp
          HABU_OUT: ${{ runner.temp }}/habu-t0-recovery/define-effect/objects
        run: >-
          timeout 300 "$RECOVERY_ROOT/seed/latest/hb" --load tools/hb-build.f -- --engine -o "$RECOVERY_ROOT/results/define-effect/hb"
          </dev/null 2>&1 | tee "$RECOVERY_ROOT/results/define-effect/engine.log"
      - name: Smoke define-effect
        working-directory: ${{ runner.temp }}/habu-t0-recovery/define-effect/source
        env:
          TMPDIR: ${{ runner.temp }}/habu-t0-recovery/define-effect/tmp
          HABU_OUT: ${{ runner.temp }}/habu-t0-recovery/define-effect/objects
        run: >-
          timeout 300 "$RECOVERY_ROOT/results/define-effect/hb" --load "$GITHUB_WORKSPACE/ci/recovery/smoke.f"
          </dev/null 2>&1 | tee "$RECOVERY_ROOT/results/define-effect/smoke.log"
      - name: Record define-effect
        working-directory: ${{ runner.temp }}/habu-t0-recovery/results/define-effect
        run: |
          sha256sum hb hb.map >sha256.txt
          cp hb hb.map source.txt sha256.txt "$RECOVERY_ROOT/latest/"
      - name: Provision quotation-list
        run: |
          mkdir -p "$RECOVERY_ROOT/quotation-list/tmp" "$RECOVERY_ROOT/quotation-list/objects" "$RECOVERY_ROOT/results/quotation-list"
          git fetch --depth=1 origin ddd6363fed7d2d653b4f5e357af701d32ef4f7f7
