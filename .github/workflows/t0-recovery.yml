      - name: Record child-run
        working-directory: ${{ runner.temp }}/habu-t0-recovery/results/child-run
        run: |
          sha256sum hb hb.map >sha256.txt
          cp hb hb.map source.txt sha256.txt "$RECOVERY_ROOT/latest/"
      - name: Provision typed-child
        run: |
          mkdir -p "$RECOVERY_ROOT/typed-child/tmp" "$RECOVERY_ROOT/typed-child/objects" "$RECOVERY_ROOT/results/typed-child"
          git fetch --depth=1 origin 7b3c8f348f26ad0c11168e1888eefaaef849a111
          git worktree add --detach "$RECOVERY_ROOT/typed-child/source" 7b3c8f348f26ad0c11168e1888eefaaef849a111
          test "$(git -C "$RECOVERY_ROOT/typed-child/source" write-tree)" = 87173d5d0fe46d16c1ebaba3953de7fc2fb31976
          printf '%s\n' '7b3c8f348f26ad0c11168e1888eefaaef849a111' '87173d5d0fe46d16c1ebaba3953de7fc2fb31976' >"$RECOVERY_ROOT/results/typed-child/source.txt"
      - name: Engine typed-child
