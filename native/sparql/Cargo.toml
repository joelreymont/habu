[package]
name = "habu-sparql"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "C ABI for Habu's standard SPARQL query library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spargebra = { git = "https://github.com/oxigraph/oxigraph", rev = "78734be853a4bec714ba09bbfad790e64f3a1150" }
spareval = { git = "https://github.com/oxigraph/oxigraph", rev = "78734be853a4bec714ba09bbfad790e64f3a1150" }
oxrdf = { git = "https://github.com/oxigraph/oxigraph", rev = "78734be853a4bec714ba09bbfad790e64f3a1150" }
serde_json = "=1.0.145"

[profile.release]
panic = "unwind"
